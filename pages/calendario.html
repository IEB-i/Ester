<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <link rel="icon" type="image/png" href="../assets/favico_Branco.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Agenda</title>
  <link rel="stylesheet" href="../CSS/index.css">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>

  <!-- Importando biblioteca FullCalendar -->
  <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
  <script src='https://cdn.jsdelivr.net/npm/@fullcalendar/core@6.1.11/locales/pt-br.global.min.js'></script>

  <meta name="description" content="Agenda Dinâmica da IEBI.">
  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#0F3A4C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script type="module" src="../JS/auth-guard.js"></script>

  <style>
    /* Estilos Premium Google Agenda Mobile & Desktop */
    .calendar-card-wrapper {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      border: 1px solid var(--border-color);
      padding: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    }

    /* Ajustes na Barra de Ferramentas do FullCalendar */
    .fc .fc-toolbar {
      display: flex !important;
      flex-wrap: wrap !important;
      align-items: center !important;
      justify-content: space-between !important;
      gap: 12px !important;
      margin-bottom: 16px !important;
    }

    .fc .fc-toolbar-title {
      font-size: 1.3rem !important;
      font-weight: 700 !important;
      color: var(--text-main);
      white-space: nowrap !important;
      text-transform: capitalize !important;
      letter-spacing: -0.3px;
    }

    .fc .fc-toolbar-chunk {
      display: flex !important;
      align-items: center !important;
      gap: 6px !important;
    }

    .fc .fc-button-primary {
      background-color: #FFFFFF !important;
      border: 1px solid var(--border-color) !important;
      color: var(--text-main) !important;
      font-weight: 600 !important;
      border-radius: 8px !important;
      padding: 5px 10px !important;
      font-size: 0.82rem !important;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04) !important;
      text-transform: capitalize !important;
      transition: var(--transition) !important;
    }

    .fc .fc-button-primary:hover {
      background-color: var(--bg-color) !important;
      border-color: var(--primary) !important;
      color: var(--primary) !important;
    }

    .fc .fc-button-primary.fc-button-active {
      background-color: var(--primary) !important;
      border-color: var(--primary) !important;
      color: #FFFFFF !important;
    }

    /* Cabeçalho dos Dias da Semana */
    .fc .fc-col-header-cell {
      padding: 6px 0 !important;
      background: #F8F9FA;
      font-weight: 700 !important;
      font-size: 0.78rem !important;
      color: var(--text-muted);
      text-transform: lowercase;
      border-bottom: 1px solid var(--border-color) !important;
    }

    /* Células dos Dias */
    .fc-daygrid-day-frame {
      min-height: 75px !important;
      padding: 2px !important;
    }

    .fc-daygrid-day-number {
      color: var(--text-main);
      font-weight: 700;
      font-size: 0.82rem;
      padding: 2px 6px !important;
    }

    /* Destaque do Dia Atual */
    .fc-day-today {
      background-color: rgba(39, 96, 174, 0.04) !important;
    }

    .fc-day-today .fc-daygrid-day-number {
      background-color: var(--primary) !important;
      color: #FFFFFF !important;
      border-radius: 50% !important;
      width: 24px !important;
      height: 24px !important;
      display: inline-flex !important;
      align-items: center !important;
      justify-content: center !important;
      font-weight: 700 !important;
      font-size: 0.78rem !important;
      margin: 2px !important;
    }

    /* Pílulas de Evento */
    .fc-daygrid-event-harness {
      margin-bottom: 2px !important;
    }

    .fc-daygrid-event {
      border: none !important;
      background: transparent !important;
      margin: 0 !important;
      padding: 0 !important;
      border-radius: 4px !important;
      width: 100% !important;
    }

    .google-agenda-pill {
      border-radius: 4px;
      padding: 3px 6px;
      font-weight: 600;
      font-size: 0.7rem;
      color: #FFFFFF !important;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: block;
      width: 100%;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
      transition: transform 0.1s ease;
      line-height: 1.3;
    }

    .google-agenda-pill:active {
      transform: scale(0.97);
    }

    /* Visão de Agenda (Lista) */
    .fc-list {
      border: 1px solid var(--border-color) !important;
      border-radius: 12px !important;
      overflow: hidden;
    }

    .fc-list-day-cushion {
      background-color: #F8F9FA !important;
      padding: 10px 16px !important;
    }

    .fc-list-day-text,
    .fc-list-day-side-text {
      font-weight: 700 !important;
      color: var(--header-bg) !important;
      font-size: 0.9rem !important;
      text-decoration: none !important;
    }

    .fc-list-event {
      cursor: pointer !important;
      transition: background-color 0.15s ease !important;
    }

    .fc-list-event:hover {
      background-color: rgba(39, 96, 174, 0.06) !important;
    }

    .fc-list-event-dot {
      border-width: 6px !important;
    }

    .fc-list-event-title {
      font-weight: 600 !important;
      color: var(--text-main) !important;
      font-size: 0.9rem !important;
    }

    /* Botão Flutuante (FAB) */
    .fab-google-agenda {
      position: fixed;
      bottom: 75px;
      right: 18px;
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background-color: var(--primary);
      color: white;
      border: none;
      font-size: 1.7rem;
      box-shadow: 0 4px 14px rgba(39, 96, 174, 0.4);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      transition: transform 0.2s, background-color 0.2s;
    }

    .fab-google-agenda:active {
      transform: scale(0.93);
    }

    /* Bloqueio de rolagem de fundo com modal aberto */
    body.modal-open {
      overflow: hidden !important;
      height: 100vh !important;
      touch-action: none !important;
    }

    /* Modal Overlay IEBI Sofisticado */
    .modal {
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: 0 !important;
      bottom: 0 !important;
      width: 100vw !important;
      height: 100vh !important;
      background: rgba(15, 40, 50, 0.65) !important;
      backdrop-filter: blur(6px) !important;
      display: flex;
      align-items: center !important;
      justify-content: center !important;
      z-index: 99999 !important;
      padding: 16px !important;
      overflow-y: auto !important;
      -webkit-overflow-scrolling: touch;
    }

    .modal-content-iebi {
      background: #FFFFFF;
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 20px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.25);
      animation: modalFadeIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      -webkit-overflow-scrolling: touch;
    }

    @keyframes modalFadeIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .modal-header-iebi {
      background: linear-gradient(135deg, #0F3A4C 0%, #0F4C3A 100%);
      color: #FFFFFF;
      padding: 20px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-header-iebi h3 {
      margin: 0;
      font-size: 1.15rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #FFFFFF;
    }

    .close-modal-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      color: #FFFFFF;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 1.1rem;
      transition: background 0.2s;
    }

    .close-modal-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    /* Segmented Selector (Agenda vs Aviso) */
    .publication-type-selector {
      display: flex;
      background: #F2F4F7;
      border-radius: 12px;
      padding: 4px;
      margin-bottom: 16px;
    }

    .pub-type-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      border-radius: 9px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .pub-type-btn.active {
      background: #FFFFFF;
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    /* Color Radio Swatches */
    .google-color-picker {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 6px;
    }

    .google-color-circle {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s;
    }

    .google-color-circle:hover {
      transform: scale(1.1);
    }

    .google-color-circle input { display: none; }

    .google-color-circle input:checked + .circle-swatch::after {
      content: '✓';
      color: white;
      font-weight: bold;
      font-size: 14px;
    }

    .circle-swatch {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Ajustes Mobile */
    @media (max-width: 768px) {
      .main-content {
        padding: 12px 10px 110px 10px !important;
      }

      .calendar-card-wrapper {
        padding: 10px;
        border-radius: 12px;
      }

      .calendar-sidebar {
        display: none !important;
      }

      .fc .fc-toolbar-title {
        font-size: 1.15rem !important;
      }

      .fc .fc-button-primary {
        padding: 4px 8px !important;
        font-size: 0.78rem !important;
      }
    }
  </style>
</head>

<body>
  <!-- Topbar Header -->
  <iebi-topbar></iebi-topbar>

  <div class="app-container">
    <iebi-sidebar active-menu="calendario"></iebi-sidebar>

    <main class="main-content">

      <div class="calendar-layout">
        <!-- Filtros de Agenda (Desktop) -->
        <aside class="calendar-sidebar" style="margin-bottom: 20px;">
          <div class="calendar-filters">
            <h4 class="filter-title">Filtrar por Cores</h4>

            <label class="filter-item">
              <input type="checkbox" class="filter-checkbox" value="#2760AE" checked>
              <span class="filter-color" style="background-color: #2760AE; border-color: #2760AE;"></span>
              <span class="filter-label">Azul (Pavão)</span>
            </label>
            <label class="filter-item">
              <input type="checkbox" class="filter-checkbox" value="#27AE60" checked>
              <span class="filter-color" style="background-color: #27AE60; border-color: #27AE60;"></span>
              <span class="filter-label">Verde (Manjericão)</span>
            </label>
            <label class="filter-item">
              <input type="checkbox" class="filter-checkbox" value="#E74C3C" checked>
              <span class="filter-color" style="background-color: #E74C3C; border-color: #E74C3C;"></span>
              <span class="filter-label">Vermelho (Flamingo)</span>
            </label>
            <label class="filter-item">
              <input type="checkbox" class="filter-checkbox" value="#8E44AD" checked>
              <span class="filter-color" style="background-color: #8E44AD; border-color: #8E44AD;"></span>
              <span class="filter-label">Roxo (Uva)</span>
            </label>
            <label class="filter-item">
              <input type="checkbox" class="filter-checkbox" value="#F39C12" checked>
              <span class="filter-color" style="background-color: #F39C12; border-color: #F39C12;"></span>
              <span class="filter-label">Laranja (Tangerina)</span>
            </label>
            <label class="filter-item">
              <input type="checkbox" class="filter-checkbox" value="#00A896" checked>
              <span class="filter-color" style="background-color: #00A896; border-color: #00A896;"></span>
              <span class="filter-label">Ciano (Turquesa)</span>
            </label>
            <label class="filter-item">
              <input type="checkbox" class="filter-checkbox" value="#E84393" checked>
              <span class="filter-color" style="background-color: #E84393; border-color: #E84393;"></span>
              <span class="filter-label">Rosa (Cereja)</span>
            </label>
            <label class="filter-item">
              <input type="checkbox" class="filter-checkbox" value="#7F8C8D" checked>
              <span class="filter-color" style="background-color: #7F8C8D; border-color: #7F8C8D;"></span>
              <span class="filter-label">Cinza (Grafite)</span>
            </label>
          </div>
        </aside>

        <!-- Grade Principal Google Agenda -->
        <div class="calendar-main calendar-card-wrapper">
          <div id="calendar"></div>
        </div>
      </div>

    </main>
  </div>

  <!-- Botão Flutuante (FAB) -->
  <button class="fab-google-agenda" id="openModalBtnFAB" title="Criar evento">
    <i class="ph ph-plus"></i>
  </button>

  <!-- Modal Sofisticado IEBI (Agenda & Avisos) -->
  <div id="eventModal" class="modal" style="display: none;">
    <div class="modal-content-iebi">
      
      <!-- Cabeçalho do Modal -->
      <div class="modal-header-iebi">
        <h3 id="modalHeaderTitle">
          <i class="ph ph-calendar-plus"></i> Nova Publicação
        </h3>
        <button id="closeModalBtn" class="close-modal-btn" type="button">
          <i class="ph ph-x"></i>
        </button>
      </div>

      <!-- Formulário -->
      <form id="eventForm" style="padding: 20px; display: flex; flex-direction: column; gap: 14px;">
        
        <!-- Seleção de Tipo de Publicação: Agenda vs Aviso -->
        <div class="publication-type-selector">
          <button type="button" class="pub-type-btn active" id="btnTypeAgenda">
            <i class="ph ph-calendar-check" style="font-size: 1.1rem;"></i> Agenda / Evento
          </button>
          <button type="button" class="pub-type-btn" id="btnTypeAviso">
            <i class="ph ph-megaphone" style="font-size: 1.1rem;"></i> Aviso do Mural
          </button>
        </div>

        <!-- Título -->
        <div class="form-group">
          <label class="form-label" style="font-weight: 600;">Título</label>
          <input type="text" id="eventTitle" class="form-control" placeholder="Ex: Culto de Celebração ou Reunião de Oração" required>
        </div>

        <!-- Datas (Início e Término) -->
        <div style="display: flex; gap: 12px;">
          <div class="form-group" style="flex: 1;">
            <label class="form-label">Data de Início</label>
            <input type="date" id="eventDate" class="form-control" required>
          </div>
          <div class="form-group" style="flex: 1;">
            <label class="form-label">Data Final (Opcional)</label>
            <input type="date" id="eventEndDate" class="form-control">
          </div>
        </div>

        <!-- Horários (Início e Encerramento) -->
        <div style="display: flex; gap: 12px;">
          <div class="form-group" style="flex: 1;">
            <label class="form-label"><i class="ph ph-clock"></i> Hora de Início</label>
            <input type="time" id="eventStartTime" class="form-control" value="19:30">
          </div>
          <div class="form-group" style="flex: 1;">
            <label class="form-label"><i class="ph ph-clock-afternoon"></i> Hora de Término</label>
            <input type="time" id="eventEndTime" class="form-control" value="21:00">
          </div>
        </div>

        <!-- Categoria / Cor -->
        <div class="form-group">
          <label class="form-label"><i class="ph ph-palette"></i> Cor do Evento</label>
          <div class="google-color-picker">
            <label class="google-color-circle" title="Azul (Pavão)">
              <input type="radio" name="eventColor" id="colorBlue" value="#2760AE" checked>
              <span class="circle-swatch" style="background-color: #2760AE;"></span>
            </label>
            <label class="google-color-circle" title="Verde (Manjericão)">
              <input type="radio" name="eventColor" id="colorGreen" value="#27AE60">
              <span class="circle-swatch" style="background-color: #27AE60;"></span>
            </label>
            <label class="google-color-circle" title="Vermelho (Flamingo)">
              <input type="radio" name="eventColor" id="colorRed" value="#E74C3C">
              <span class="circle-swatch" style="background-color: #E74C3C;"></span>
            </label>
            <label class="google-color-circle" title="Roxo (Uva)">
              <input type="radio" name="eventColor" id="colorPurple" value="#8E44AD">
              <span class="circle-swatch" style="background-color: #8E44AD;"></span>
            </label>
            <label class="google-color-circle" title="Laranja (Tangerina)">
              <input type="radio" name="eventColor" id="colorOrange" value="#F39C12">
              <span class="circle-swatch" style="background-color: #F39C12;"></span>
            </label>
            <label class="google-color-circle" title="Ciano (Turquesa)">
              <input type="radio" name="eventColor" id="colorCyan" value="#00A896">
              <span class="circle-swatch" style="background-color: #00A896;"></span>
            </label>
            <label class="google-color-circle" title="Rosa (Cereja)">
              <input type="radio" name="eventColor" id="colorPink" value="#E84393">
              <span class="circle-swatch" style="background-color: #E84393;"></span>
            </label>
            <label class="google-color-circle" title="Cinza (Grafite)">
              <input type="radio" name="eventColor" id="colorGrey" value="#7F8C8D">
              <span class="circle-swatch" style="background-color: #7F8C8D;"></span>
            </label>
          </div>
        </div>

        <!-- Detalhes / Descrição -->
        <div class="form-group">
          <label class="form-label">Descrição / Observações (Opcional)</label>
          <textarea id="eventDescription" class="form-control" rows="2" placeholder="Escreva detalhes adicionais..."></textarea>
        </div>

        <!-- Checkbox Fixar Destaque -->
        <div class="checkbox-group" style="margin-top: 4px;">
          <label class="switch">
            <input type="checkbox" id="eventPinned">
            <span class="slider"></span>
          </label>
          <span class="switch-label" style="font-size: 0.85rem; font-weight: 600;">Fixar no topo do mural</span>
        </div>

        <!-- Botões de Ação -->
        <div class="form-actions" style="margin-top: 8px; display: flex; gap: 10px; justify-content: flex-end; border: none; padding: 0;">
          <button type="button" id="deleteEventBtn" class="btn" style="background-color: #E74C3C; color: #FFF; display: none; margin-right: auto;">
            <i class="ph ph-trash"></i> Excluir
          </button>
          <button type="button" id="cancelModalBtn" class="btn btn-secondary">Cancelar</button>
          <button type="submit" id="saveEventBtn" class="btn btn-primary">
            <i class="ph ph-floppy-disk"></i> Salvar
          </button>
        </div>
      </form>
    </div>
  </div>

  <iebi-bottom-nav active-item="agenda"></iebi-bottom-nav>

  <script src="../JS/components.js"></script>
  <script src="../JS/script.js"></script>
  <script type="module" src="../JS/firebase.js"></script>
  <script type="module" src="../JS/calendario.js"></script>
</body>

</html>
