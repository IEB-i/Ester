<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="icon" type="image/png" href="../assets/favico_Branco.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Certificado - IEBI</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

        @page {
            size: A4 landscape;
            margin: 0;
        }

        body {
            margin: 0;
            padding: 0;
            background: #555;
            display: flex;
            flex-direction: column;
            gap: 20px;
            justify-content: flex-start;
            align-items: center;
            min-height: 100vh;
            padding: 20px 0;
            font-family: 'Inter', sans-serif;
        }

        .cert-container {
            width: 297mm;
            height: 210mm;
            /* Substitua o nome do arquivo se necessário */
            background-image: url('../assets/cert-impactar.png');
            background-size: 100% 100%;
            background-repeat: no-repeat;
            background-position: center;
            position: relative;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        @media print {
            body {
                background: white;
                margin: 0;
                padding: 0;
                display: block;
            }

            .cert-container {
                box-shadow: none;
                width: 100%;
                height: 100vh;
                page-break-after: always;
            }

            #btnPrint {
                display: none !important;
            }

            /* Força a impressão do background no Chrome/Edge */
            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
        }

        .overlay-text {
            position: absolute;
            color: #333;
            font-weight: 700;
            text-align: center;
            /* O contorno branco ajuda a ler caso o fundo seja escuro, pode remover se preferir */
            text-shadow: 1px 1px 0px #fff, -1px -1px 0px #fff, 1px -1px 0px #fff, -1px 1px 0px #fff;
        }

        /* POSICIONAMENTOS APROXIMADOS (Ajuste as porcentagens conforme necessário) */
        #lblNome {
            top: 48%;
            left: 8.5%;
            width: 51%;
            font-size: 16pt;
            white-space: nowrap;
            overflow: hidden;
        }

        #lblInicioDia {
            top: 53.8%;
            left: 26%;
            width: 3%;
            font-size: 14pt;
        }

        #lblInicioMes {
            top: 53.8%;
            left: 32%;
            width: 3%;
            font-size: 14pt;
        }

        #lblInicioAno {
            top: 53.8%;
            left: 37.6%;
            width: 4%;
            font-size: 14pt;
        }

        #lblFimDia {
            top: 53.8%;
            left: 47%;
            width: 3%;
            font-size: 14pt;
        }

        #lblFimMes {
            top: 53.8%;
            left: 52.5%;
            width: 3%;
            font-size: 14pt;
        }

        #lblFimAno {
            top: 53.8%;
            left: 58.7%;
            width: 4%;
            font-size: 14pt;
        }

        .btn-print {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #0F3A4C;
            color: white;
            border: none;
            padding: 16px 32px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(15, 76, 58, 0.3);
            z-index: 1000;
            transition: 0.2s;
        }

        .btn-print:hover {
            background: #0b3628;
        }
    </style>
    <script type="module" src="../JS/auth-guard.js"></script>
</head>

<body>

    <button class="btn-print" id="btnPrint" onclick="window.print()">Imprimir / Salvar PDF</button>

    <div class="cert-container">
        <div id="lblNome" class="overlay-text">Carregando...</div>

        <!-- Data de Início -->
        <div id="lblInicioDia" class="overlay-text">--</div>
        <div id="lblInicioMes" class="overlay-text">--</div>
        <div id="lblInicioAno" class="overlay-text">----</div>

        <!-- Data de Fim -->
        <div id="lblFimDia" class="overlay-text">--</div>
        <div id="lblFimMes" class="overlay-text">--</div>
        <div id="lblFimAno" class="overlay-text">----</div>
    </div>

    <script type="module" src="../JS/certificado.js"></script>
</body>

</html>
